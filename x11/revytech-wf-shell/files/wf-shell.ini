# REVYTECH system default — /usr/local/etc/wf-shell/wf-shell.ini
#
# Hierarchy:
#   1) ~/.config/wf-shell.ini     user prefs (optional, wins if present)
#   2) this file                  system default
#
# Binaries and shared assets come from the package under /usr/local.
# Put personal wallpaper/theme paths only in the user file.

[background]
cycle_timeout = 150
fade_duration = 1000
fill_mode = fill_and_crop
image = /usr/local/share/wf-shell/backgrounds/wallpaper.jpg
randomize = false

[dock]
autohide = true
autohide_duration = 300
dock_height = 100
edge_offset = 20
icon_height = 48
position = bottom

[panel]
autohide = false
autohide_duration = 300
background_color = gtk_headerbar
battery_status = none
clock_font = default
clock_format = %e %A %H:%M
css_path = /usr/local/share/wf-shell/css/default.css
edge_offset = 20
# FreeBSD power (override in user ini if needed)
hibernate_command = /sbin/shutdown -p now
launchers_size = 42
launchers_spacing = 4
layer = top
logout_command = wayland-logout
menu_fuzzy_search = true
menu_list = false
menu_logout_command = wayland-logout
menu_min_category_width = 200
menu_min_content_height = 500
menu_min_content_width = 500
menu_show_categories = true
middle_click_close = false
minimal_height = 28
network_status = connection
notifications_autohide_timeout = 2.500000
notifications_critical_in_dnd = true
notifications_icon_size = 32
position = top
reboot_command = /sbin/shutdown -r now
shutdown_command = /sbin/shutdown -p now
suspend_command = /usr/sbin/acpiconf -s 3
tray_icon_size = 32
volume_display_timeout = 2.500000
volume_icon_size = 32
volume_scroll_sensitivity = 0.050000
widgets_center = none
widgets_left = menu spacing4 launchers window-list
# No battery on desktops without UPower (safer default)
widgets_right = volume spacing8 network spacing8 clock

# REVYTECH system default Wayfire configuration
#
# Install locations (package):
#   FreeBSD:  /usr/local/etc/wayfire/wayfire.ini
#   Linux:    /etc/wayfire/wayfire.ini  (or /usr/local/etc/wayfire when PREFIX≠/usr)
#
# Hierarchy (wayfire-config-path.sh / wayfire-session-launch):
#   1) $WAYFIRE_CONFIG_FILE          explicit override
#   2) ~/.config/wayfire.ini         user prefs (optional; wins if present)
#   3) system path above             this file
#
# Rules for this file:
#   - Only system package paths (/usr/local or /usr) — never personal home dirs
#   - No machine-specific [output:…] modes (those belong in user prefs / kanshi)
#   - panel + background via libexec launchers (never double-start wf-shell)
#   - dock off by default

[input]
xkb_layout = us
# xkb_options = caps:escape

[core]
plugins = \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  ipc \
  ipc-rules \
  move \
  oswitch \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 3
vheight = 3
preferred_decoration_mode = client

# XWayland for legacy X11 apps; ready script exports DISPLAY into session bus
xwayland = true
xwayland_startup_script = /usr/local/libexec/wayfire-xwayland-ready

# Mouse / modifiers ──────────────────────────────────────────────────────────

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[zoom]
modifier = <super>

[alpha]
modifier = <super> <alt>

[wrot]
activate = <super> <ctrl> BTN_RIGHT

[fisheye]
toggle = <super> <ctrl> KEY_F

# Startup ────────────────────────────────────────────────────────────────────

[autostart]
# Push session vars into D-Bus (no systemd required)
0_env = dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP

# false when panel/background are listed below — avoids dual wf-panel
autostart_wf_shell = false

# System packages only — launchers pick user ~/.config/wf-shell.ini else system etc
panel = /usr/local/libexec/wf-shell-launch panel
background = /usr/local/libexec/wf-shell-launch background
# dock = /usr/local/libexec/wf-shell-launch dock

# Output profiles (user may override with ~/.config/kanshi/config)
outputs = kanshi

notifications = mako
gamma = wlsunset

# Lock before sleep / after idle
idle = swayidle -w timeout 300 'swaylock -f' timeout 600 'swaylock -f' before-sleep 'swaylock -f'

portal = /usr/local/libexec/xdg-desktop-portal
pipewire = pipewire

# Keybindings / apps ─────────────────────────────────────────────────────────

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = alacritty
binding_terminal_alt = <super> <shift> KEY_ENTER
command_terminal_alt = kitty

binding_launcher = <super> KEY_D
command_launcher = wofi --show drun
binding_launcher_run = <super> <shift> KEY_D
command_launcher_run = wofi --show run

binding_files = <super> KEY_F1
command_files = thunar

binding_volume_gui = <super> KEY_V
command_volume_gui = pavucontrol

binding_lock = <super> <shift> KEY_ESC
command_lock = swaylock -f

binding_logout = <super> KEY_ESC
command_logout = wlogout

# Screenshots (grim is portable; replace in user prefs if preferred)
binding_screenshot = KEY_PRINT
command_screenshot = grim
binding_screenshot_interactive = <shift> KEY_PRINT
command_screenshot_interactive = grim -g "$(slurp)"

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%
binding_mute = KEY_MUTE
command_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle

binding_play = KEY_PLAYPAUSE | KEY_PLAYCD
command_play = playerctl play-pause
binding_next = KEY_NEXTSONG
command_next = playerctl next
binding_prev = KEY_PREVIOUSSONG
command_prev = playerctl previous

# Window management ──────────────────────────────────────────────────────────

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_X
toggle_sticky = <super> <shift> KEY_X

[grid]
slot_bl = <super> KEY_KP1
slot_b  = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l  = <super> KEY_LEFT  | <super> KEY_KP4
slot_c  = <super> KEY_UP    | <super> KEY_KP5
slot_r  = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t  = <super> KEY_KP8
slot_tr = <super> KEY_KP9
restore = <super> KEY_DOWN  | <super> KEY_KP0

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_ESC

[scale]
toggle = <super> KEY_TAB

[vswitch]
binding_left  = <ctrl> <super> KEY_LEFT
binding_down  = <ctrl> <super> KEY_DOWN
binding_up    = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
with_win_left  = <ctrl> <super> <shift> KEY_LEFT
with_win_down  = <ctrl> <super> <shift> KEY_DOWN
with_win_up    = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

[cube]
activate = <ctrl> <alt> BTN_LEFT

[expo]
toggle = <super> KEY_E
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O

[invert]
toggle = <super> KEY_I

[wayfire-shell]
toggle_menu = <super>

# Compositor idle / monitor power (DPMS)
# -1 = never blank the monitor (REVYTECH default — no surprise sleep)
# Positive seconds = blank after that idle time. Locking is separate (swayidle).
[idle]
dpms_timeout = -1
screensaver_timeout = -1

# Animate: explicit defaults avoid empty-type log spam from incomplete user overrides
[animate]
enabled_for = (type is "toplevel" | (type is "x-or" & focusable is true))
open_animation = fade
close_animation = fade
duration = 300
